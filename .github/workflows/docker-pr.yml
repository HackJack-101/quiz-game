name: Docker build check

# Pull requests that change the Dockerfile: build the image to catch errors
# before merging. The image is never pushed: main and releases publish it.
on:
  pull_request:
    branches: [main]
    paths: ['Dockerfile']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      # Skipped when secrets are unavailable (Dependabot and fork pull requests).
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            APP_COMMIT=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
