services:
  app:
    # QUIZ_VERSION: a release (1.2.0), `stable` (the latest release) or `latest` (main).
    image: ghcr.io/hackjack-101/quiz-game:${QUIZ_VERSION:-latest}
    pull_policy: always
    container_name: quiz-game
    # Note: We don't set user here because the entrypoint script runs as root
    # to fix volume permissions, then drops privileges to nextjs (uid 1001)
    ports:
      - '3000:3000'
    volumes:
      - quiz_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  quiz_data:
